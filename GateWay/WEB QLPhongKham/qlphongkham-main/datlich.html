<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./img/logohinh.png" rel="icon" type="image/png">
  <title>Đặt lịch khám</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https:cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="top-bar">
    <div class="top-links">
      <a href="./bacsi.html">Tìm bác sĩ</a>
      <a href="#">Khóa học trực tuyến</a>
      <a href="#">Chăm sóc khách hàng</a>
    </div>
  </div>

  <header class="main-header">
    <img src="./img/logo.png" alt="HeartCare Logo" class="logo">
    <div class="search-section">
      <input type="text" placeholder="Tìm kiếm...">
    </div>
   <div class="tools">
      <i class="fa-regular fa-calendar-days calendar-icon"></i>
      <img src="https://flagcdn.com/w40/vn.png" alt="Vietnam Flag" class="flag-icon">
    </div> 
  </header>

  <nav class="menu-bar">
     <a href="./index.html" class="active">Trang chủ</a>
     <a href="./about-us.html">Giới thiệu</a>
     <a href="./dichvu.html">Dịch vụ</a>
     <a href="./datlich.html">Đặt lịch</a>
     <a href="./lienhe.html">Liên hệ</a>
     <a href="./blog.html">Tin tức</a>
  </nav>
 
  <section class="banner">
    <div class="container banner-content">
      <h1>ĐĂNG KÝ KHÁM<br /></h1>
    </div>
  </section>

  <div class="form-wrapper">
    <h2>Nội dung chi tiết đặt hẹn</h2>

    <!-- THÊM ID CHO FORM -->
    <form id="bookingForm">

      <div class="form-section">
        <label for="service">Dịch vụ *</label>
        <select id="service" required>
          <option value="">Chọn dịch vụ</option>
          <option value="1">Khám nội tổng quát</option>
          <option value="2">Khám nhi</option>
        </select>
      </div>

      <div class="form-section">
        <label for="doctor">Bác sĩ</label>
        <select id="doctor">
          <option value="">Chọn Bác sĩ muốn khám</option>
          <option value="1">BS Nguyễn Văn A</option>
          <option value="2">BS Trần Thị B</option>
          <option value="3">BS Lê Thị Mận</option>
          <option value="4">BS Trần Văn Xoài</option>
          <option value="5">BS Trần Thị Sầu Riêng</option>
        </select>
      </div>

      <h2>Thông tin khách hàng</h2>

      <div class="form-row">
        <div class="form-group">
          <label for="fullname">Họ và tên *</label>
          <input type="text" id="fullname" required placeholder="Họ và tên">
        </div>

        <div class="form-group">
          <label>Giới tính</label>
          <div class="gender-group">
            <label><input type="radio" name="gender" value="Nam"> Nam</label>
            <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dob">Ngày tháng năm sinh *</label>
          <input type="date" id="dob" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Nhập email">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input type="tel" id="phone" required placeholder="Nhập số điện thoại">
        </div>
        <div class="form-group">
          <label for="reason">Lý do khám *</label>
          <textarea id="reason" placeholder="Triệu chứng" rows="7" class="input_book"></textarea>
        </div>
      </div>

      <div class="form-section checkbox">
        <label>
          <input type="checkbox" required>
          Tôi đồng ý với <a href="#">chính sách bảo vệ dữ liệu</a>.
        </label>
      </div>

      <div class="submit-section">
        <button type="submit" class="submit-btn">Gửi thông tin</button>
      </div>
    </form>
  </div>

  <!-- FOOTER -->
  <footer class="modern-footer">
    <!-- ... (NGUYÊN VẸN THEO BẠN) ... -->
  </footer>

  <!-- ⭐ ĐÂY LÀ PHẦN KẾT NỐI API ⭐ -->
  <script>
  document.getElementById("bookingForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const data = {
          MaBenhNhan: 1,
          MaBacSi: document.getElementById("doctor").value || null,
          NgayBatDau: new Date().toISOString(),
          TrangThai: "DaDat",
          GhiChu: document.getElementById("reason").value
      };

      try {
          const response = await fetch("https://localhost:44340/api-nguoidung/LichHen/dat-lich", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data)
          });

          const result = await response.json();

          if (response.ok) {
              alert("Đặt lịch thành công!");
          } else {
              alert("Lỗi đặt lịch: " + result.message);
          }
      } catch (err) {
          alert("Không thể kết nối API Gateway");
          console.error(err);
      }
  });
  </script>

</body>
</html>
