<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Bệnh nhân - DAH</title>
  <link rel="stylesheet" href="css/LichHen.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
      <span class="brand-text">DAH Clinic</span>
    </div>
    <nav class="menu">
			<a href="index.html"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a>
            <a href="TaiKhoan.html"><i class="fa-solid fa-user-shield"></i><span>Tài khoản</span></a>
            <a href="BacSi.html"><i class="fa-solid fa-user-doctor"></i><span>Bác sĩ</span></a>
            <a href="NhaCungCap.html"><i class="fa-solid fa-truck"></i><span>Nhà cung cấp</span></a>
            <a href="BenhNhan.html" class="active"><i class="fa-solid fa-user-injured"></i><span>Bệnh nhân</span></a>
            <a href="LichHen.html"><i class="fa-solid fa-calendar-days"></i><span>Lịch hẹn</span></a>
            <a href="HoSoBenhAn.html"><i class="fa-solid fa-file-medical"></i><span>Hồ sơ bệnh án</span></a>
			<a href="KhamBenh.html"><i class="fa-solid fa-stethoscope"></i><span>Khám bệnh</span></a>
            <a href="Thuoc.html"><i class="fa-solid fa-capsules"></i><span>Thuốc</span></a>
            <a href="DonThuoc.html"><i class="fa-solid fa-prescription-bottle-medical"></i><span>Đơn thuốc</span></a>
            <a href="TonKho.html"><i class="fa-solid fa-warehouse"></i><span>Tồn kho thuốc</span></a>
            <a href="HoaDon.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Hóa đơn</span></a>
    </nav>
  </aside>

  <main class="main">
    <header class="header">
      <h1>Quản lý Bệnh nhân</h1>
      <div class="actions">
        <a href="FormBenhNhan.html" class="btn"><i class="fa-solid fa-plus"></i> Thêm mới</a>
        <button class="btn neutral" id="btnRefresh"><i class="fa-solid fa-rotate"></i> Làm mới</button>
      </div>
    </header>

    <section class="filter-bar card">
      <input id="txtHoTen" class="input" placeholder="Tìm theo họ tên...">
      <input id="txtSDT" class="input" placeholder="Tìm theo số điện thoại...">
    </section>

    <section class="card">
      <h3>Danh sách bệnh nhân</h3>
      <div class="table-wrap" style="margin-top:12px;">
        <table id="tblBenhNhan">
          <thead>
            <tr>
              <th>Họ tên</th>
              <th>Ngày sinh</th>
              <th>Giới tính</th>
              <th>SĐT</th>
              <th>Email</th>
              <th>Địa chỉ</th>
              <th>CMTND/CCCD</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
  const token = localStorage.getItem("token");
  if(!token){ alert("Vui lòng đăng nhập!"); location.href="Login.html"; }

  const baseUrl = "https://localhost:44340";

  async function fetchAuth(url, method="GET", body=null){
    const res = await fetch(url,{
      method,
      headers:{
        "Authorization":"Bearer "+token,
        "Content-Type":"application/json"
      },
      body: body ? JSON.stringify(body) : null
    });
    if(res.status === 401){ localStorage.removeItem("token"); alert("Hết hạn đăng nhập!"); location.href="Login.html"; return; }
    return res.json();
  }

  async function loadBenhNhan(){
    const body = { 
      page:1, 
      pageSize:999, 
      HoTen: document.getElementById("txtHoTen").value || "", 
      SoDienThoai: document.getElementById("txtSDT").value || "" 
    };
    const data = await fetchAuth(baseUrl + "/api-admin/benhnhan/search","POST", body);
    const tbody = document.querySelector("#tblBenhNhan tbody");
    tbody.innerHTML="";
    data.data.forEach(bn=>{
      const row = `
        <tr>
          <td>${bn.hoTen}</td>
          <td>${bn.ngaySinh ? new Date(bn.ngaySinh).toLocaleDateString() : ""}</td>
          <td>${bn.gioiTinh}</td>
          <td>${bn.soDienThoai}</td>
          <td>${bn.email}</td>
          <td>${bn.diaChi}</td>
		  <td>${bn.cmtnD_NV || ""}</td>
          <td>
            <a class="btn small neutral" href="FormBenhNhan.html?id=${bn.maBenhNhan}">Sửa</a>
            <button class="btn small warn" onclick="deleteBenhNhan(${bn.maBenhNhan})">Xóa</button>
          </td>
        </tr>
      `;
      tbody.innerHTML += row;
    });
  }

  async function deleteBenhNhan(id){
    if(!confirm("Bạn có chắc chắn muốn xoá bệnh nhân này?")) return;
    const res = await fetchAuth(baseUrl+"/api-admin/benhnhan/delete/"+id,"DELETE");
    alert(res.message || "Xóa thành công!");
    loadBenhNhan();
  }

  document.getElementById("txtHoTen").addEventListener("input",loadBenhNhan);
  document.getElementById("txtSDT").addEventListener("input",loadBenhNhan);
  document.getElementById("btnRefresh").addEventListener("click",loadBenhNhan);

  loadBenhNhan();

  const sidebar = document.getElementById("sidebar");
  document.getElementById("toggleSidebar").onclick = ()=> sidebar.classList.toggle("collapsed");
</script>
</body>
</html>
