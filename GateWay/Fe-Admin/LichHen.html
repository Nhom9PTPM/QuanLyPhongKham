<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Lịch hẹn - DAH</title>
  <link rel="stylesheet" href="css/LichHen.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
      <span class="brand-text">DAH Clinic</span>
    </div>
    <nav class="menu">
			<a href="index.html"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a>
            <a href="TaiKhoan.html"><i class="fa-solid fa-user-shield"></i><span>Tài khoản</span></a>
            <a href="BacSi.html"><i class="fa-solid fa-user-doctor"></i><span>Bác sĩ</span></a>
            <a href="NhaCungCap.html"><i class="fa-solid fa-truck"></i><span>Nhà cung cấp</span></a>
            <a href="BenhNhan.html"><i class="fa-solid fa-user-injured"></i><span>Bệnh nhân</span></a>
            <a href="LichHen.html" class="active"><i class="fa-solid fa-calendar-days"></i><span>Lịch hẹn</span></a>
            <a href="HoSoBenhAn.html"><i class="fa-solid fa-file-medical"></i><span>Hồ sơ bệnh án</span></a>
			<a href="KhamBenh.html"><i class="fa-solid fa-stethoscope"></i><span>Khám bệnh</span></a>
            <a href="Thuoc.html"><i class="fa-solid fa-capsules"></i><span>Thuốc</span></a>
            <a href="DonThuoc.html"><i class="fa-solid fa-prescription-bottle-medical"></i><span>Đơn thuốc</span></a>
            <a href="TonKho.html"><i class="fa-solid fa-warehouse"></i><span>Tồn kho thuốc</span></a>
            <a href="HoaDon.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Hóa đơn</span></a>
    </nav>
  </aside>

  <main class="main">
    <header class="header">
      <h1>Quản lý Lịch hẹn</h1>
      <div class="actions">
        <a href="FormLichHen.html" class="btn"><i class="fa-solid fa-plus"></i> Thêm mới</a>
        <button class="btn neutral" id="btnRefresh"><i class="fa-solid fa-rotate"></i> Làm mới</button>
      </div>
    </header>

    <section class="filter-bar card">
      <input id="txtHoTen" class="input" placeholder="Tìm theo tên bệnh nhân...">
    </section>

    <section class="card">
      <h3>Danh sách Lịch hẹn</h3>
      <div class="table-wrap" style="margin-top:12px;">
        <table id="tblLichHen">
          <thead>
            <tr>
              <th>Bệnh nhân</th>
              <th>Ngày bắt đầu</th>
              <th>Giờ hẹn</th>
              <th>Trạng thái</th>
              <th>Ghi chú</th>
              <th style="width:180px;">Thao tác</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
  const token = localStorage.getItem("token");
  if (!token) {
    alert("Vui lòng đăng nhập!");
    location.href = "Login.html";
  }
	// Lấy quyền từ localStorage
const role = localStorage.getItem("maVaiTro");

// Nếu là bệnh nhân → chuyển sang web.html
if (role == "4") {
    window.location.href = "web.html";
}

// Lấy danh sách các menu
const links = document.querySelectorAll(".menu a");

// Quyền cho bác sĩ
const menuForDoctor = [
	"index.html",
    "BacSi.html",
    "BenhNhan.html",
    "LichHen.html",
    "KhamBenh.html",
    "HoSoBenhAn.html",
    "DonThuoc.html",
    "Thuoc.html"
];

// Quyền cho nhân viên
const menuForStaff = [
	"index.html",
    "BenhNhan.html",
    "LichHen.html",
    "DonThuoc.html",
    "Thuoc.html"
];

// Ẩn menu theo quyền
links.forEach(link => {
    const href = link.getAttribute("href");

    // Admin → full quyền
    if (role == "1") return;

    // Bác sĩ
    if (role == "2") {
        if (!menuForDoctor.includes(href)) {
            link.style.display = "none";
        }
        return;
    }

    // Nhân viên
    if (role == "3") {
        if (!menuForStaff.includes(href)) {
            link.style.display = "none";
        }
        return;
    }
});
  const baseUrl = "https://localhost:44340/api-admin/lichhen";

  async function fetchAuth(url, method="GET", body=null) {
    const res = await fetch(url, {
      method,
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: body ? JSON.stringify(body) : null
    });
    if (res.status === 401) {
      localStorage.removeItem("token");
      alert("Hết hạn đăng nhập!");
      location.href = "Login.html";
      return;
    }
    if (!res.ok) throw new Error("Fetch lỗi: " + res.status);
    return res.json();
  }

  async function loadLichHen() {
    const body = { page: 1, pageSize: 999, HoTen: document.getElementById("txtHoTen").value || "" };
    let data;
    try {
      data = await fetchAuth(baseUrl + "/search", "POST", body);
    } catch(err) {
      console.error(err);
      alert("Fetch lỗi: " + err.message);
      return;
    }
    const tbody = document.querySelector("#tblLichHen tbody");
    tbody.innerHTML = "";

    data.data.forEach(item => {
      const row = `
        <tr>
          <td>${item.hoTen}</td>
          <td>${new Date(item.ngayBatDau).toLocaleDateString()}</td>
          <td>${item.gioHen}</td>
          <td>${item.trangThai}</td>
          <td>${item.ghiChu || ""}</td>
          <td>
            <a class="btn small neutral" href="FormLichHen.html?id=${item.maLichHen}">Sửa</a>
            <button class="btn small warn" onclick="deleteLichHen(${item.maLichHen})">Xóa</button>
          </td>
        </tr>
      `;
      tbody.innerHTML += row;
    });
  }

  async function deleteLichHen(id) {
    if (!confirm("Bạn có chắc chắn muốn xoá lịch hẹn này?")) return;
    try {
      await fetchAuth(baseUrl + "/delete/" + id, "GET");
      loadLichHen();
    } catch(err) {
      alert("Lưu thành công");
    }
  }

  document.getElementById("txtHoTen").addEventListener("input", loadLichHen);
  document.getElementById("btnRefresh").addEventListener("click", loadLichHen);

  loadLichHen();

  const sidebar = document.getElementById("sidebar");
  document.getElementById("toggleSidebar").onclick = () => sidebar.classList.toggle("collapsed");
</script>
</body>
</html>
