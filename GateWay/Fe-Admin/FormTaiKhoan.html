<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Tài khoản - DAH</title>
  <link rel="stylesheet" href="css/LichHen.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
      <span class="brand-text">DAH Clinic</span>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <h1 id="formTitle">Thêm Tài khoản</h1>
      <div class="actions">
        <a href="TaiKhoan.html" class="btn neutral"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
      </div>
    </header>

    <section class="card">
      <form id="formUser">
        <div class="form-group">
          <label>Họ tên</label>
          <input type="text" id="txtHoTen" class="input" required>
        </div>
        <div class="form-group">
          <label>Giới tính</label>
          <select id="selectGioiTinh" class="input">
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ngày sinh</label>
          <input type="date" id="txtNgaySinh" class="input">
        </div>
        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="text" id="txtSoDienThoai" class="input">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="txtEmail" class="input">
        </div>
        <div class="form-group">
          <label>Địa chỉ</label>
          <input type="text" id="txtDiaChi" class="input">
        </div>
        <div class="form-group">
          <label>Loại người dùng</label>
          <input type="text" id="txtLoaiNguoiDung" class="input">
        </div>
        <div class="form-group">
          <label>Tên đăng nhập</label>
          <input type="text" id="txtTenDangNhap" class="input" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="txtMatKhau" class="input" required>
        </div>
        <div class="form-group">
          <label>Quyền</label>
          <input type="text" id="txtLoaiQuyen" class="input">
        </div>
        <div class="form-group">
          <label>Mã vai trò</label>
          <input type="number" id="txtMaVaiTro" class="input">
        </div>
        <div class="form-group">
          <label>Trạng thái</label>
          <select id="selectTrangThai" class="input">
            <option value="true">Hoạt động</option>
            <option value="false">Khóa</option>
          </select>
        </div>
        <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
      </form>
    </section>
  </main>
</div>

<script>
const token = localStorage.getItem("token");
if(!token){
    alert("Vui lòng đăng nhập!");
    location.href="Login.html";
}

const baseUrl = "https://localhost:44340";
const params = new URLSearchParams(window.location.search);
const userId = params.get("id"); // Lấy id từ URL

// Element references
const txtHoTen = document.getElementById("txtHoTen");
const selectGioiTinh = document.getElementById("selectGioiTinh");
const txtNgaySinh = document.getElementById("txtNgaySinh");
const txtSoDienThoai = document.getElementById("txtSoDienThoai");
const txtEmail = document.getElementById("txtEmail");
const txtDiaChi = document.getElementById("txtDiaChi");
const txtLoaiNguoiDung = document.getElementById("txtLoaiNguoiDung");
const txtTenDangNhap = document.getElementById("txtTenDangNhap");
const txtMatKhau = document.getElementById("txtMatKhau");
const txtLoaiQuyen = document.getElementById("txtLoaiQuyen");
const txtMaVaiTro = document.getElementById("txtMaVaiTro");
const selectTrangThai = document.getElementById("selectTrangThai");
const formTitle = document.getElementById("formTitle");

// Fetch helper
async function fetchAuth(url, method="GET", body=null){
    const res = await fetch(url,{
        method,
        headers:{
            "Authorization": "Bearer "+token,
            "Content-Type":"application/json"
        },
        body: body ? JSON.stringify(body) : null
    });
    if(res.status===401){
        localStorage.removeItem("token");
        alert("Hết hạn đăng nhập!");
        location.href="Login.html";
        return;
    }
    if(res.status===204) return null; 
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
}

// Load user khi sửa
async function loadUser(){
    if(!userId) return;
    formTitle.innerText = "Sửa Tài khoản";
    try {
        const data = await fetchAuth(`${baseUrl}/api-admin/users/get-by-id/${userId}`);
        if(!data) return;

        txtHoTen.value = data.hoTen || "";
        selectGioiTinh.value = data.gioiTinh || "Nam";
        txtNgaySinh.value = data.ngaySinh ? data.ngaySinh.split("T")[0] : "";
        txtSoDienThoai.value = data.soDienThoai || "";
        txtEmail.value = data.email || "";
        txtDiaChi.value = data.diaChi || "";
        txtLoaiNguoiDung.value = data.loaiNguoiDung || "";
        txtTenDangNhap.value = data.tenDangNhap || "";
        txtTenDangNhap.disabled = true; 
        txtMatKhau.value = data.matKhau || "";
        txtLoaiQuyen.value = data.loaiQuyen || "";
        txtMaVaiTro.value = data.maVaiTro || "";
        selectTrangThai.value = data.trangThai ? "true" : "false";
    } catch(err) {
        console.error(err);
        alert("Lỗi khi tải dữ liệu người dùng");
    }
}

// Form submit
document.getElementById("formUser").addEventListener("submit", async e=>{
    e.preventDefault();

    try {
        let model;
        let url;

        if(userId){ // Sửa (GIỮ NGUYÊN)
            model = {
                maNguoiDung: parseInt(userId),
                hoTen: txtHoTen.value,
                gioiTinh: selectGioiTinh.value,
                ngaySinh: txtNgaySinh.value || null,
                soDienThoai: txtSoDienThoai.value,
                email: txtEmail.value,
                diaChi: txtDiaChi.value,
                loaiNguoiDung: txtLoaiNguoiDung.value,
                tenDangNhap: txtTenDangNhap.value,
                matKhau: txtMatKhau.value,
                loaiQuyen: txtLoaiQuyen.value,
                maVaiTro: txtMaVaiTro.value ? parseInt(txtMaVaiTro.value) : null,
                trangThai: selectTrangThai.value === "true"
            };
            url = `${baseUrl}/api-admin/users/update-user`;
        } 
        else { // THÊM MỚI — SỬA Ở ĐÂY
            model = {
                nguoidung: {
                    hoTen: txtHoTen.value,
                    gioiTinh: selectGioiTinh.value,
                    ngaySinh: txtNgaySinh.value || null,
                    soDienThoai: txtSoDienThoai.value,
                    email: txtEmail.value,
                    diaChi: txtDiaChi.value,
                    loaiNguoiDung: txtLoaiNguoiDung.value
                },
                taikhoan: {
                    tenDangNhap: txtTenDangNhap.value,
                    matKhau: txtMatKhau.value,
                    loaiQuyen: txtLoaiQuyen.value,
                    maVaiTro: txtMaVaiTro.value ? parseInt(txtMaVaiTro.value) : null,
                    trangThai: selectTrangThai.value === "true"
                }
            };
            url = `${baseUrl}/api-admin/users/create-user`;
        }

        let res = await fetchAuth(url, "POST", model);

        if(res?.Message) alert(res.Message);
        else alert("Thao tác thành công!");

        window.location.href="TaiKhoan.html";
    } 
    catch(err) {
        console.error(err);
        alert("Lỗi khi lưu: " + err.message);
    }
});

// Khởi tạo
loadUser();


</script>
<script>
  const sidebar = document.getElementById("sidebar");
  document.getElementById("toggleSidebar").onclick = () => sidebar.classList.toggle("collapsed");
</script>
</body>
</html>
