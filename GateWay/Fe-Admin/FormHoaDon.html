<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thêm / Sửa Hóa đơn - DAH Clinic</title>
<link rel="stylesheet" href="css/LichHen.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>
<div class="container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <span class="brand-text">DAH Clinic</span>
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <h1 id="title">Thêm Hóa đơn</h1>
            <div class="actions">
                <button class="btn" onclick="saveForm()"><i class="fa-solid fa-save"></i> Lưu</button>
                <a class="btn neutral" href="HoaDon.html"><i class="fa-solid fa-arrow-left"></i> Trở về</a>
            </div>
        </header>

        <section class="card">
            <div class="form-row">
                <div class="form-group">
                    <label>Mã bệnh nhân</label>
                    <input id="txtBenhNhan" class="input" placeholder="Nhập mã bệnh nhân..." />
                </div>
                <div class="form-group">
                    <label>Phương thức thanh toán</label>
                    <select id="txtPTTT" class="input">
                        <option value="">-- Chọn --</option>
                        <option>Tiền mặt</option>
                        <option>Chuyển khoản</option>
                        <option>Thẻ ngân hàng</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Trạng thái</label>
                    <select id="txtTrangThai" class="input">
                        <option value="">-- Chọn --</option>
                        <option>Chưa thanh toán</option>
                        <option>Đã thanh toán</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card" style="margin-top:20px;">
            <div class="section-header">
                <h3>Chi tiết hóa đơn</h3>
                <button class="btn small" onclick="addRow()"><i class="fa-solid fa-plus"></i> Thêm dòng</button>
            </div>
            <div class="table-wrap" style="margin-top:12px;">
                <table id="tblCTHD">
                    <thead>
                        <tr>
                            <th style="display:none;">ID</th>
                            <th>Thuốc</th>
                            <th>Số lượng</th>
                            <th>Đơn giá</th>
                            <th>Thành tiền</th>
                            <th style="width:80px;">Xóa</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <h3 style="text-align:right;margin-top:12px;">
                Tổng: <span id="txtTongTien">0 đ</span>
            </h3>
        </section>
    </main>
</div>

<script>
const baseUrl = "https://localhost:44340";
const token = localStorage.getItem("token");
if(!token){alert("Vui lòng đăng nhập!");location.href="Login.html";}

const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get("id"); // id hóa đơn nếu sửa
let listThuoc = [];

async function fetchAuth(url, method="GET", body=null){
    const res = await fetch(url,{
        method,
        headers: {"Authorization":"Bearer "+token,"Content-Type":"application/json"},
        body: body ? JSON.stringify(body) : null
    });
    if(res.status === 401){ localStorage.removeItem("token"); alert("Hết hạn đăng nhập!"); location.href="Login.html"; }
    return res.json();
}

// Load danh sách thuốc
async function loadThuoc(){
    const res = await fetchAuth(baseUrl+"/api-admin/Thuoc/search","POST",{page:1,pageSize:999});
    listThuoc = res.data;
}

// Thêm dòng chi tiết
function addRow(item=null){
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td style="display:none;">
            <input type="hidden" class="maCT" value="${item?.maChiTietHoaDon || 0}">
        </td>
        <td>
            <select class="input cboThuoc">
                <option value="">-- Chọn thuốc --</option>
                ${listThuoc.map(t=>`<option value="${t.maThuoc}">${t.tenThuoc}</option>`).join('')}
            </select>
        </td>
        <td><input class="input soLuong" type="number" min="1" value="${item?.soLuong||1}"/></td>
        <td><input class="input donGia" type="number" min="0" value="${item?.donGia||0}"/></td>
        <td class="thanhTien">0 đ</td>
        <td><button class="btn small warn" onclick="this.parentElement.parentElement.remove(); calcTotal();">X</button></td>
    `;
    document.querySelector("#tblCTHD tbody").appendChild(tr);

    const cbo = tr.querySelector(".cboThuoc");
    const sl = tr.querySelector(".soLuong");
    const dg = tr.querySelector(".donGia");

    if(item?.maThuoc) cbo.value = item.maThuoc;

    cbo.addEventListener("change", function(){
        const t = listThuoc.find(x=>x.maThuoc==this.value);
        if(t) dg.value = t.gia || 0;
        calcTotal();
    });
    sl.addEventListener("input", calcTotal);
    dg.addEventListener("input", calcTotal);

    calcTotal();
}

// Tính tổng
function calcTotal(){
    let total=0;
    document.querySelectorAll("#tblCTHD tbody tr").forEach(row=>{
        const sl=Number(row.querySelector(".soLuong").value)||0;
        const dg=Number(row.querySelector(".donGia").value)||0;
        const tt=sl*dg;
        row.querySelector(".thanhTien").innerText=tt.toLocaleString("vi-VN")+" đ";
        total+=tt;
    });
    document.getElementById("txtTongTien").innerText = total.toLocaleString("vi-VN")+" đ";
}

// Load dữ liệu khi sửa
async function loadEdit() {
    if (!id) return;
    document.getElementById("title").innerText = "Sửa Hóa đơn";

    const res = await fetchAuth(baseUrl + "/api-admin/HoaDon/get-by-id/" + id);
    const hd = res.hd;
    const ct = res.ct;

    document.getElementById("txtBenhNhan").value = hd.maBenhNhan;
    document.getElementById("txtPTTT").value = hd.phuongThucThanhToan;
    document.getElementById("txtTrangThai").value = hd.trangThai;

    document.querySelector("#tblCTHD tbody").innerHTML = "";
    ct.forEach(x => addRow(x));

    calcTotal();
}

// Lưu hóa đơn
async function saveForm() {
    let listCT = [];

    document.querySelectorAll("#tblCTHD tbody tr").forEach(row => {
        const maCT = Number(row.querySelector(".maCT").value);
        const maThuoc = Number(row.querySelector(".cboThuoc").value);
        const sl = Number(row.querySelector(".soLuong").value);
        const dg = Number(row.querySelector(".donGia").value);

        if (maThuoc)
            listCT.push({
                maChiTietHoaDon: maCT, 
                maThuoc: maThuoc,
                soLuong: sl,
                donGia: dg
            });
    });

    if (!document.getElementById("txtBenhNhan").value) {
        alert("Vui lòng nhập mã bệnh nhân!");
        return;
    }

    const model = {
        hoadon: {
            maHoaDon: id ? Number(id) : 0,
            maBenhNhan: Number(document.getElementById("txtBenhNhan").value),
            phuongThucThanhToan: document.getElementById("txtPTTT").value,
            trangThai: document.getElementById("txtTrangThai").value,
            tongTien: Number(document.getElementById("txtTongTien").innerText.replace(/\D/g,''))
        },
        listchitiet: listCT
    };

    const url = id 
        ? baseUrl + "/api-admin/HoaDon/update-hoadon" 
        : baseUrl + "/api-admin/HoaDon/create-hoadon";

    try {
        const res = await fetchAuth(url, "POST", model);
        if(res.errors){
            console.error(res);
            alert("Lỗi validation: " + JSON.stringify(res.errors));
            return;
        }
        alert("Lưu thành công!");
        location.href = "HoaDon.html";
    } catch (err) {
        console.error(err);
        alert("Có lỗi xảy ra khi lưu hóa đơn!");
    }
}

// INIT
async function init(){ 
    await loadThuoc(); 
    await loadEdit(); 
}
init();

document.getElementById("toggleSidebar").onclick = ()=>document.getElementById("sidebar").classList.toggle("collapsed");
</script>
</body>
</html>
