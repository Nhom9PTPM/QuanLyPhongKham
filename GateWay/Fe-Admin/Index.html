<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - DAH Clinic</title>
  <link rel="stylesheet" href="css/LichHen.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <span class="brand-text">DAH Clinic</span>
      </div>
      <nav class="menu">
			<a href="index.html" class="active"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a>
            <a href="TaiKhoan.html"><i class="fa-solid fa-user-shield"></i><span>Tài khoản</span></a>
            <a href="BacSi.html"><i class="fa-solid fa-user-doctor"></i><span>Bác sĩ</span></a>
            <a href="NhaCungCap.html"><i class="fa-solid fa-truck"></i><span>Nhà cung cấp</span></a>
            <a href="BenhNhan.html"><i class="fa-solid fa-user-injured"></i><span>Bệnh nhân</span></a>
            <a href="LichHen.html"><i class="fa-solid fa-calendar-days"></i><span>Lịch hẹn</span></a>
            <a href="HoSoBenhAn.html"><i class="fa-solid fa-file-medical"></i><span>Hồ sơ bệnh án</span></a>
			<a href="KhamBenh.html"><i class="fa-solid fa-stethoscope"></i><span>Khám bệnh</span></a>
            <a href="Thuoc.html"><i class="fa-solid fa-capsules"></i><span>Thuốc</span></a>
            <a href="DonThuoc.html"><i class="fa-solid fa-prescription-bottle-medical"></i><span>Đơn thuốc</span></a>
            <a href="TonKho.html"><i class="fa-solid fa-warehouse"></i><span>Tồn kho thuốc</span></a>
            <a href="HoaDon.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Hóa đơn</span></a>
      </nav>
    </aside>

    <main class="main">
      <header class="header">
        <h1>Bảng điều khiển tổng quan</h1>
      </header>

      <!-- Thống kê nhanh -->
      <section class="grid-4">
        <div class="card stat-card">
          <i class="fa-solid fa-user-doctor icon"></i>
          <div>
            <p class="stat-title">Bác sĩ</p>
            <h2 id="totalDoctors">0</h2>
          </div>
        </div>
        <div class="card stat-card">
          <i class="fa-solid fa-user-injured icon"></i>
          <div>
            <p class="stat-title">Bệnh nhân</p>
            <h2 id="totalPatients">0</h2>
          </div>
        </div>
        <div class="card stat-card">
          <i class="fa-solid fa-file-invoice-dollar icon"></i>
          <div>
            <p class="stat-title">Hóa đơn</p>
            <h2 id="totalInvoices">0</h2>
          </div>
        </div>
        <div class="card stat-card">
          <i class="fa-solid fa-sack-dollar icon"></i>
          <div>
            <p class="stat-title">Doanh thu (VNĐ)</p>
            <h2 id="totalRevenue">0</h2>
          </div>
        </div>
      </section>

      <!-- Biểu đồ -->
      <section class="grid-2">
        <div class="card">
          <h3>Doanh thu theo tháng</h3>
          <canvas id="chartDoanhThu"></canvas>
        </div>
        <div class="card">
          <h3>Lượt khám theo tháng</h3>
          <canvas id="chartLuotKham"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script>
  // Lấy token từ localStorage
  const token = localStorage.getItem('token');
  if (!token) {
    alert('Vui lòng đăng nhập!');
    window.location.href = 'Login.html'; // dùng đường dẫn tương đối
  } else {
    console.log('Token hiện tại:', token);
	// Lấy quyền từ localStorage
const role = localStorage.getItem("maVaiTro");

// Nếu là bệnh nhân → chuyển sang web.html
if (role == "4") {
    window.location.href = "web.html";
}

// Lấy danh sách các menu
const links = document.querySelectorAll(".menu a");

// Quyền cho bác sĩ
const menuForDoctor = [
	"index.html",
    "BacSi.html",
    "BenhNhan.html",
    "LichHen.html",
    "KhamBenh.html",
    "HoSoBenhAn.html",
    "DonThuoc.html",
    "Thuoc.html"
];

// Quyền cho nhân viên
const menuForStaff = [
	"index.html",
    "BenhNhan.html",
    "LichHen.html",
    "DonThuoc.html",
    "Thuoc.html"
];

// Ẩn menu theo quyền
links.forEach(link => {
    const href = link.getAttribute("href");

    // Admin → full quyền
    if (role == "1") return;

    // Bác sĩ
    if (role == "2") {
        if (!menuForDoctor.includes(href)) {
            link.style.display = "none";
        }
        return;
    }

    // Nhân viên
    if (role == "3") {
        if (!menuForStaff.includes(href)) {
            link.style.display = "none";
        }
        return;
    }
});

    // Hàm kiểm tra lỗi response
    async function fetchWithAuth(url) {
      const response = await fetch(url, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      if (!response.ok) {
        if (response.status === 401) {
          alert('Token không hợp lệ hoặc đã hết hạn. Vui lòng đăng nhập lại.');
          localStorage.removeItem('token');
          window.location.href = 'Login.html';
        } else {
          throw new Error('Lỗi từ server: ' + response.status);
        }
      }
      return response.json();
    }

    // Lấy tổng quan
    fetchWithAuth('https://localhost:44340/api-admin/dashboard/get-tong-quan')
      .then(data => {
        document.getElementById('totalDoctors').textContent = data.tongBacSi;
		document.getElementById('totalPatients').textContent = data.tongBenhNhan;
		document.getElementById('totalInvoices').textContent = data.tongHoaDon;
		document.getElementById('totalRevenue').textContent = data.tongDoanhThu;

      })
      .catch(console.error);

    const year = 2025;

    // Doanh thu theo tháng
    fetchWithAuth(`https://localhost:44340/api-admin/dashboard/get-doanhthu-thang/${year}`)
      .then(data => {
        console.log('Doanh thu theo tháng:', data);
        const months = data.map(item => `Th${item.thang}`);
        const revenue = data.map(item => item.tongDoanhThu);
        const ctx1 = document.getElementById('chartDoanhThu').getContext('2d');
        new Chart(ctx1, {
          type: 'bar',
          data: { labels: months, datasets: [{ label: 'Doanh thu (triệu VNĐ)', data: revenue, borderWidth: 1 }] },
          options: { scales: { y: { beginAtZero: true } } }
        });
      })
      .catch(console.error);

    // Lượt khám theo tháng
    fetchWithAuth(`https://localhost:44340/api-admin/dashboard/get-luotkham-thang/${year}`)
      .then(data => {
        console.log('Lượt khám theo tháng:', data);
        const months = data.map(item => `Th${item.thang}`);
        const visits = data.map(item => item.soLuotKham);
        const ctx2 = document.getElementById('chartLuotKham').getContext('2d');
        new Chart(ctx2, {
          type: 'line',
          data: { labels: months, datasets: [{ label: 'Lượt khám', data: visits, fill: false, borderColor: '#36A2EB', tension: 0.3 }] }
        });
      })
      .catch(console.error);
  }
</script>
<script>
  const toggleBtn = document.getElementById('toggleSidebar');
  const sidebar = document.getElementById('sidebar');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
  });
</script>
<script>
  const toggleBtn = document.getElementById('toggleSidebar');
  const sidebar = document.getElementById('sidebar');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
  });
</script>

</body>
</html>
