<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Nhà cung cấp - DAH Clinic</title>
  <link rel="stylesheet" href="css/LichHen.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
      <span class="brand-text">DAH Clinic</span>
    </div>
    <nav class="menu">
			<a href="index.html"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a>
            <a href="TaiKhoan.html"><i class="fa-solid fa-user-shield"></i><span>Tài khoản</span></a>
            <a href="BacSi.html"><i class="fa-solid fa-user-doctor"></i><span>Bác sĩ</span></a>
            <a href="NhaCungCap.html" class="active"><i class="fa-solid fa-truck"></i><span>Nhà cung cấp</span></a>
            <a href="BenhNhan.html"><i class="fa-solid fa-user-injured"></i><span>Bệnh nhân</span></a>
            <a href="LichHen.html"><i class="fa-solid fa-calendar-days"></i><span>Lịch hẹn</span></a>
            <a href="HoSoBenhAn.html"><i class="fa-solid fa-file-medical"></i><span>Hồ sơ bệnh án</span></a>
			<a href="KhamBenh.html"><i class="fa-solid fa-stethoscope"></i><span>Khám bệnh</span></a>
            <a href="Thuoc.html"><i class="fa-solid fa-capsules"></i><span>Thuốc</span></a>
            <a href="DonThuoc.html"><i class="fa-solid fa-prescription-bottle-medical"></i><span>Đơn thuốc</span></a>
            <a href="TonKho.html"><i class="fa-solid fa-warehouse"></i><span>Tồn kho thuốc</span></a>
            <a href="HoaDon.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Hóa đơn</span></a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="header">
      <h1>Quản lý Nhà cung cấp</h1>
      <div class="actions">
        <a href="FormNhaCungCap.html" class="btn"><i class="fa-solid fa-plus"></i> Thêm mới</a>
        <button class="btn neutral" id="btnRefresh"><i class="fa-solid fa-rotate"></i> Làm mới</button>
      </div>
    </header>

    <!-- Filter -->
    <section class="filter-bar card">
      <input id="txtTenNCC" class="input" placeholder="Tìm theo tên nhà cung cấp...">
    </section>

    <!-- Table -->
    <section class="card">
      <h3>Danh sách Nhà cung cấp</h3>
      <div class="table-wrap" style="margin-top:12px;">
        <table id="tblNhaCungCap">
          <thead>
            <tr>
              <th>Tên nhà cung cấp</th>
              <th>Địa chỉ</th>
              <th>Số điện thoại</th>
              <th style="width:180px;">Thao tác</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
  const token = localStorage.getItem("token");
  if (!token) {
    alert("Vui lòng đăng nhập!");
    location.href = "Login.html";
  }

  const baseUrl = "https://localhost:44340";

  async function fetchAuth(url, method="GET", body=null) {
    const res = await fetch(url, {
      method,
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: body ? JSON.stringify(body) : null
    });
    if (res.status === 401) {
      localStorage.removeItem("token");
      alert("Hết hạn đăng nhập!");
      location.href = "Login.html";
      return;
    }
    return res.json();
  }

  async function loadNhaCungCap() {
    const body = {
      page: 1,
      pageSize: 999,
      TenNhaCungCap: document.getElementById("txtTenNCC").value || ""
    };
    const data = await fetchAuth(baseUrl + "/api-admin/NhaCungCap/search", "POST", body);
    const tbody = document.querySelector("#tblNhaCungCap tbody");
    tbody.innerHTML = "";

    data.data.forEach(ncc => {
      const row = `
        <tr>
          <td>${ncc.tenNhaCungCap || ""}</td>
          <td>${ncc.diaChi || ""}</td>
          <td>${ncc.soDienThoai || ""}</td>
          <td>
            <a class="btn small neutral" href="FormNhaCungCap.html?id=${ncc.maNhaCungCap}">Sửa</a>
            <button class="btn small warn" onclick="deleteNCC(${ncc.maNhaCungCap})">Xóa</button>
          </td>
        </tr>
      `;
      tbody.innerHTML += row;
    });
  }

  async function deleteNCC(id) {
    if (!confirm("Bạn có chắc muốn xoá nhà cung cấp này?")) return;
    const res = await fetchAuth(baseUrl + "/api-admin/NhaCungCap/delete/" + id, "GET");
    alert(res);
    loadNhaCungCap();
  }

  document.getElementById("txtTenNCC").addEventListener("input", loadNhaCungCap);
  document.getElementById("btnRefresh").addEventListener("click", loadNhaCungCap);

  loadNhaCungCap();

  document.getElementById("toggleSidebar").onclick = () =>
    document.getElementById("sidebar").classList.toggle("collapsed");

</script>
</body>
</html>
