<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <!-- Link đến file CSS tách riêng -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <h2>Admin Login</h2>

        <input type="text" id="username" placeholder="Tên đăng nhập" />
        <input type="password" id="password" placeholder="Mật khẩu" />

        <div class="show-pass">
            <input type="checkbox" id="showPassword"> Hiện mật khẩu
        </div>

        <button id="loginBtn">Đăng nhập</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const showPassword = document.getElementById('showPassword');
        const passwordInput = document.getElementById('password');

        // Hiển thị mật khẩu
        showPassword.addEventListener('change', () => {
            passwordInput.type = showPassword.checked ? 'text' : 'password';
        });

        loginBtn.addEventListener('click', async () => {
            const tenDangNhap = document.getElementById('username').value.trim();
            const matKhau = document.getElementById('password').value.trim();

            if (!tenDangNhap || !matKhau) {
                errorMsg.textContent = "Vui lòng nhập đủ thông tin!";
                return;
            }

            try {
                const response = await fetch('https://localhost:44340/api-admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenDangNhap, matKhau })
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        errorMsg.textContent = "Tên đăng nhập hoặc mật khẩu không đúng!";
                    } else {
                        errorMsg.textContent = "Lỗi server: " + response.status;
                    }
                    return;
                }

                const data = await response.json();

                localStorage.setItem('token', data.token);
                localStorage.setItem('maTaiKhoan', data.maTaiKhoan);
                localStorage.setItem('maNguoiDung', data.maNguoiDung);
                localStorage.setItem('maVaiTro', data.maVaiTro);

                if (data.maVaiTro == 4) {
                    window.location.href = "web.html";
                } else {
                    window.location.href = "index.html";
                }

            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Không thể kết nối đến server!";
            }
        });
    </script>
</body>
</html>
