<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Tài khoản - DAH</title>
  <link rel="stylesheet" href="css/LichHen.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
    <span class="brand-text">DAH Clinic</span>
  </div>

  <nav class="menu">
    <a href="index.html"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a>
    <a href="TaiKhoan.html"><i class="fa-solid fa-user-shield"></i><span>Tài khoản</span></a>
    <a href="BacSi.html"><i class="fa-solid fa-user-doctor"></i><span>Bác sĩ</span></a>
    <a href="BenhNhan.html"><i class="fa-solid fa-user-injured"></i><span>Bệnh nhân</span></a>
    <a href="LichHen.html"><i class="fa-solid fa-calendar-days"></i><span>Lịch hẹn</span></a>
    <a href="HoSoBenhAn.html"><i class="fa-solid fa-file-medical"></i><span>Hồ sơ bệnh án</span></a>
    <a href="Thuoc.html"><i class="fa-solid fa-capsules"></i><span>Thuốc & kho</span></a>
    <a href="HoaDon.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Hóa đơn</span></a>
    <a href="ThongBao.html"><i class="fa-solid fa-bell"></i><span>Thông báo</span></a>
    <a href="LichSu.html"><i class="fa-solid fa-book"></i><span>Nhật ký hoạt động</span></a>
  </nav>
</aside>
    <div id="sidebarContainer"></div>

    <!-- Nội dung chính -->
    <main class="main">
      <header class="header">
        <h1>Quản lý Tài khoản</h1>
        <div class="actions">
          <a href="FormTaiKhoan.html" class="btn"><i class="fa-solid fa-plus"></i> Thêm mới</a>
          <button class="btn neutral" id="btnRefresh"><i class="fa-solid fa-rotate"></i> Làm mới</button>
        </div>
      </header>

      <!-- Bộ lọc -->
      <section class="filter-bar card">
        <input id="txtSearch" class="input" placeholder="Tìm theo tên đăng nhập hoặc vai trò...">
        <select id="selectTrangThai" class="input" style="max-width:200px">
          <option value="">Tất cả trạng thái</option>
          <option value="1">Hoạt động</option>
          <option value="0">Khóa</option>
        </select>
      </section>

      <!-- Bảng danh sách -->
      <section class="card">
        <h3>Danh sách tài khoản</h3>
        <div class="table-wrap" style="margin-top:12px;">
          <table id="tblTaiKhoan">
            <thead>
              <tr>
                <th>Tên đăng nhập</th>
                <th>Họ tên</th>
                <th>Vai trò</th>
                <th>Trạng thái</th>
                <th style="width:180px;">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <!-- Dữ liệu mẫu -->
              <tr>
                <td>admin</td>
                <td>Nguyễn Văn A</td>
                <td>Quản trị viên</td>
                <td><span class="small muted">Hoạt động</span></td>
                <td>
                  <a class="btn small neutral" href="FormTaiKhoan.html?user=admin">Sửa</a>
                  <button class="btn small warn btn-delete" data-id="admin">Xóa</button>
                </td>
              </tr>
              <tr>
                <td>kt01</td>
                <td>Trần Thị B</td>
                <td>Kế toán</td>
                <td><span class="small muted">Khóa</span></td>
                <td>
                  <a class="btn small neutral" href="FormTaiKhoan.html?user=kt01">Sửa</a>
                  <button class="btn small warn btn-delete" data-id="kt01">Xóa</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Load sidebar
    fetch("components/sidebar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("sidebarContainer").innerHTML = html;
        const sidebar = document.getElementById("sidebar");
        document.getElementById("toggleSidebar").onclick = () => sidebar.classList.toggle("collapsed");
        const current = location.pathname.split("/").pop();
        document.querySelectorAll(".menu a").forEach(link => {
          if (link.getAttribute("href") === current) link.classList.add("active");
        });
      });

    // Lọc tìm kiếm đơn giản
    const txtSearch = document.getElementById("txtSearch");
    const selectTrangThai = document.getElementById("selectTrangThai");
    const tbody = document.querySelector("#tblTaiKhoan tbody");

    function filter() {
      const q = txtSearch.value.toLowerCase();
      const st = selectTrangThai.value;
      for (let r of tbody.rows) {
        const text = r.innerText.toLowerCase();
        const isMatch = text.includes(q);
        const stText = r.cells[3].innerText.toLowerCase();
        const matchSt = !st || (st === "1" && stText.includes("hoạt")) || (st === "0" && stText.includes("khóa"));
        r.style.display = (isMatch && matchSt) ? "" : "none";
      }
    }
    txtSearch.addEventListener("input", filter);
    selectTrangThai.addEventListener("change", filter);
  </script>
    <script>
  const sidebar = document.getElementById("sidebar");
  document.getElementById("toggleSidebar").onclick = () => sidebar.classList.toggle("collapsed");

  // Tự động highlight mục hiện tại
  const currentPage = location.pathname.split("/").pop();
  document.querySelectorAll(".menu a").forEach(link => {
    if (link.getAttribute("href") === currentPage) link.classList.add("active");
  });
</script>
</body>
</html>
