<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quản lý Bác sĩ - Phòng Khám</title>

  <link rel="stylesheet" href="css/BacSi.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body ng-app="AppPhongKham" ng-controller="BacSiCtrl">
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <span class="brand-text">DAH Clinic</span>
      </div>

      <nav class="menu">
        <a href="index.html"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a>
        <a href="TaiKhoan.html"><i class="fa-solid fa-user-shield"></i><span>Tài khoản</span></a>
        <a href="BacSi.html" class="active"><i class="fa-solid fa-user-doctor"></i><span>Bác sĩ</span></a>
        <a href="BenhNhan.html"><i class="fa-solid fa-user-injured"></i><span>Bệnh nhân</span></a>
        <a href="LichHen.html"><i class="fa-solid fa-calendar-days"></i><span>Lịch hẹn</span></a>
        <a href="HoSoBenhAn.html"><i class="fa-solid fa-file-medical"></i><span>Hồ sơ bệnh án</span></a>
        <a href="Thuoc.html"><i class="fa-solid fa-capsules"></i><span>Thuốc & kho</span></a>
        <a href="HoaDon.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Hóa đơn</span></a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="header">
        <h1>Quản lý Bác sĩ</h1>
        <div class="actions">
          <a class="btn" href="FormBacSi.html"><i class="fa-solid fa-plus"></i> Thêm Bác sĩ</a>
          <button class="btn neutral" ng-click="LoadBacSi()"><i class="fa-solid fa-rotate"></i> Làm mới</button>
        </div>
      </header>

      <!-- Filter / Search -->
      <section class="filter-bar card">
        <input ng-model="TuKhoa" class="input" placeholder="Tìm theo tên, chuyên khoa, số phòng..." />
      </section>

      <!-- Table -->
      <section class="card">
        <h3 class="h3">Danh sách Bác sĩ</h3>
        <div class="table-wrap" style="margin-top:12px">
          <table id="tblBacSi">
            <thead>
              <tr>
                <th>Mã</th>
                <th>Họ tên</th>
                <th>Chuyên khoa</th>
                <th>Bằng cấp</th>
                <th>Số phòng</th>
                <th>Trạng thái</th>
                <th style="width:160px">Thao tác</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="x in listBacSi | filter:TuKhoa">
                <td>{{x.maBacSi}}</td>
                <td>{{x.hoTen}}</td>
                <td>{{x.chuyenKhoa}}</td>
                <td>{{x.bangCap}}</td>
                <td>{{x.soPhong}}</td>
                <td>
                  <span class="small muted" ng-if="x.trangThai">Hoạt động</span>
                  <span class="small muted" ng-if="!x.trangThai">Ngưng hoạt động</span>
                </td>
                <td class="table-actions">
                  <button class="btn small neutral" ng-click="Sua(x.maBacSi)">Sửa</button>
                  <button class="btn small warn" ng-click="Xoa(x.maBacSi)">Xóa</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Script Angular -->
  <script src="angular/angular.min.js"></script>
  <script src="angular/global.js"></script>
  <script src="js/BacSi.js"></script>

  <!-- Sidebar Toggle -->
  <script>
    const sidebar = document.getElementById("sidebar");
    document.getElementById("toggleSidebar").onclick = () =>
      sidebar.classList.toggle("collapsed");
  </script>
</body>
</html>
