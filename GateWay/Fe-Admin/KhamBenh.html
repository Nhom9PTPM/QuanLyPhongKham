<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Khám bệnh - DAH Clinic</title>
  <link rel="stylesheet" href="css/LichHen.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="container">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button id="toggleSidebar" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
      <span class="brand-text">DAH Clinic</span>
    </div>
    <nav class="menu">
			<a href="index.html"><i class="fa-solid fa-chart-line"></i><span>Tổng quan</span></a>
            <a href="TaiKhoan.html"><i class="fa-solid fa-user-shield"></i><span>Tài khoản</span></a>
            <a href="BacSi.html"><i class="fa-solid fa-user-doctor"></i><span>Bác sĩ</span></a>
            <a href="NhaCungCap.html"><i class="fa-solid fa-truck"></i><span>Nhà cung cấp</span></a>
            <a href="BenhNhan.html"><i class="fa-solid fa-user-injured"></i><span>Bệnh nhân</span></a>
            <a href="LichHen.html"><i class="fa-solid fa-calendar-days"></i><span>Lịch hẹn</span></a>
            <a href="HoSoBenhAn.html"><i class="fa-solid fa-file-medical"></i><span>Hồ sơ bệnh án</span></a>
			<a href="KhamBenh.html" class="active"><i class="fa-solid fa-stethoscope"></i><span>Khám bệnh</span></a>
            <a href="Thuoc.html"><i class="fa-solid fa-capsules"></i><span>Thuốc</span></a>
            <a href="DonThuoc.html"><i class="fa-solid fa-prescription-bottle-medical"></i><span>Đơn thuốc</span></a>
            <a href="TonKho.html"><i class="fa-solid fa-warehouse"></i><span>Tồn kho thuốc</span></a>
            <a href="HoaDon.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Hóa đơn</span></a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="header">
      <h1>Quản lý Khám bệnh</h1>
      <div class="actions">
        <a href="FormKhamBenh.html" class="btn"><i class="fa-solid fa-plus"></i> Thêm mới</a>
        <button id="btnRefresh" class="btn neutral"><i class="fa-solid fa-rotate"></i> Làm mới</button>
      </div>
    </header>

    <!-- FILTER -->
    <section class="filter-bar card">
      <input id="txtHoTen" class="input" placeholder="Tìm theo tên bệnh nhân...">

      <input id="txtFrom" type="date" class="input" style="max-width:200px">
      <input id="txtTo" type="date" class="input" style="max-width:200px">
    </section>

    <!-- TABLE -->
    <section class="card">
      <h3>Danh sách khám bệnh</h3>

      <div class="table-wrap" style="margin-top:12px;">
        <table id="tblKhamBenh">
          <thead>
            <tr>
              <th>Bệnh nhân</th>
              <th>Ngày khám</th>
              <th>Chẩn đoán</th>
              <th>Người thực hiện</th>
              <th style="width:180px;">Thao tác</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>


<script>
const token = localStorage.getItem("token");
if (!token) {
  alert("Vui lòng đăng nhập!");
  location.href = "Login.html";
}
	// Lấy quyền từ localStorage
const role = localStorage.getItem("maVaiTro");

// Nếu là bệnh nhân → chuyển sang web.html
if (role == "4") {
    window.location.href = "web.html";
}

// Lấy danh sách các menu
const links = document.querySelectorAll(".menu a");

// Quyền cho bác sĩ
const menuForDoctor = [
	"index.html",
    "BacSi.html",
    "BenhNhan.html",
    "LichHen.html",
    "KhamBenh.html",
    "HoSoBenhAn.html",
    "DonThuoc.html",
    "Thuoc.html"
];

// Quyền cho nhân viên
const menuForStaff = [
	"index.html",
    "BenhNhan.html",
    "LichHen.html",
    "DonThuoc.html",
    "Thuoc.html"
];

// Ẩn menu theo quyền
links.forEach(link => {
    const href = link.getAttribute("href");

    // Admin → full quyền
    if (role == "1") return;

    // Bác sĩ
    if (role == "2") {
        if (!menuForDoctor.includes(href)) {
            link.style.display = "none";
        }
        return;
    }

    // Nhân viên
    if (role == "3") {
        if (!menuForStaff.includes(href)) {
            link.style.display = "none";
        }
        return;
    }
});

const baseUrl = "https://localhost:44340";

function fmt(dateStr) {
  const d = new Date(dateStr);
  return isNaN(d) ? "" : d.toLocaleDateString("vi-VN");
}

async function fetchAuth(url, method = "GET", body = null) {
  const res = await fetch(url, {
    method,
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: body ? JSON.stringify(body) : null
  });

  if (res.status === 401) {
    localStorage.removeItem("token");
    alert("Hết hạn đăng nhập!");
    location.href = "Login.html";
  }

  return res.json();
}

async function loadKhamBenh() {
  const body = {
    page: 1,
    pageSize: 999,
    HoTen: document.getElementById("txtHoTen").value || "",
    fr_NgayKham: document.getElementById("txtFrom").value || null,
    to_NgayKham: document.getElementById("txtTo").value || null
  };

  const data = await fetchAuth(baseUrl + "/api-admin/KhamBenh/search", "POST", body);

  const tbody = document.querySelector("#tblKhamBenh tbody");
  tbody.innerHTML = "";

  data.data.forEach(k => {
    const row = `
      <tr>
        <td>${k.hoTen}</td>
        <td>${fmt(k.ngayKham)}</td>
        <td>${k.chanDoan || ""}</td>
        <td>${k.nguoiThucHien || ""}</td>
        <td>
          <a class="btn small neutral" href="FormKhamBenh.html?id=${k.maKham}">Sửa</a>
          <button class="btn small warn" onclick="deleteKB(${k.maKham})">Xóa</button>
        </td>
      </tr>
    `;
    tbody.innerHTML += row;
  });
}

async function deleteKB(id) {
  if (!confirm("Xác nhận xoá?")) return;
  const res = await fetchAuth(baseUrl + "/api-admin/KhamBenh/delete/" + id, "GET");
  alert(res);
  loadKhamBenh();
}

document.getElementById("txtHoTen").oninput = loadKhamBenh;
document.getElementById("txtFrom").onchange = loadKhamBenh;
document.getElementById("txtTo").onchange = loadKhamBenh;
document.getElementById("btnRefresh").onclick = loadKhamBenh;

loadKhamBenh();

document.getElementById("toggleSidebar").onclick = () =>
  document.getElementById("sidebar").classList.toggle("collapsed");

</script>

</body>
</html>
